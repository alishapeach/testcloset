services:
  - type: web
    name: hollys-closet
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
      - key: CHATRO_CODE
        sync: false
      - key: UNDERGROUND_CODE
        sync: false
      - key: AVAILABLE_TAGS
        sync: false
